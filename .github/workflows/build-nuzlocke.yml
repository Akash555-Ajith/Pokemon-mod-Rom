name: Build Emerald Nuzlocke

on:
  workflow_dispatch:
  push:
    paths:
      - 'nuzlocke-build/**'
      - '.github/workflows/build-nuzlocke.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev
      - name: Fetch pinned Emerald source and compiler
        run: |
          git clone https://github.com/pret/pokeemerald.git /tmp/pokeemerald
          git -C /tmp/pokeemerald checkout 731ad5bfd6e6f265508d0efcca0ba42f9dcf5881
          git clone https://github.com/pret/agbcc.git /tmp/agbcc
          git -C /tmp/agbcc checkout da598c1d918402c42c0c0d7128ba14567f3175e9
      - name: Build original-compatible compiler
        working-directory: /tmp/agbcc
        run: ./build.sh && ./install.sh ../pokeemerald
      - name: Verify unmodified Emerald matches the original ROM
        working-directory: /tmp/pokeemerald
        run: make -j2 compare
      - name: Apply Nuzlocke rules
        run: |
          git -C /tmp/pokeemerald apply --check "$GITHUB_WORKSPACE/nuzlocke-build/nuzlocke.patch"
          git -C /tmp/pokeemerald apply "$GITHUB_WORKSPACE/nuzlocke-build/nuzlocke.patch"
          python3 "$GITHUB_WORKSPACE/nuzlocke-build/verify_inputs.py" /tmp/pokeemerald
      - name: Compile custom ROM
        working-directory: /tmp/pokeemerald
        run: make -j2
      - name: Package ROM and build symbols
        run: |
          mkdir -p output
          cp /tmp/pokeemerald/pokeemerald.gba "output/Pokemon Emerald - Nuzlocke Seven Rules.gba"
          cp /tmp/pokeemerald/pokeemerald.elf output/
          cp /tmp/pokeemerald/pokeemerald.map output/
          cp nuzlocke-build/README.md output/
          sha256sum output/*.gba > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Emerald-Nuzlocke
          path: output/
          retention-days: 30
